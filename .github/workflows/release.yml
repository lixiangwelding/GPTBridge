name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要创建或更新的 Release 标签，例如 v0.1.22"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 检查前端
        run: npm run check

      - name: 构建 Rust 测试所需的任务 Worker
        run: cargo build --manifest-path personal-runtime/Cargo.toml --target-dir src-tauri/target --bin coding-tools-personal-worker

      - name: 编译 Windows Rust 测试
        working-directory: src-tauri
        run: cargo test --no-run

      - name: 仅构建 Windows NSIS 安装程序
        run: npm run tauri -- build --bundles nsis

      - name: 上传 Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-universal-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 检查前端
        run: npm run check

      - name: 构建 Rust 测试所需的任务 Worker
        run: cargo build --manifest-path personal-runtime/Cargo.toml --target-dir src-tauri/target --bin coding-tools-personal-worker

      - name: 运行 Rust 测试
        working-directory: src-tauri
        run: cargo test

      - name: 仅构建通用版 macOS DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    needs:
      - build-windows
      - build-universal-macos
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/windows

      - name: 下载 macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: GPTBridge ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          prerelease: true
          body: |
            GPTBridge ${{ inputs.release_tag || github.ref_name }} 桌面预览版；Windows NSIS 安装包与 macOS 通用 DMG 来自同一源码提交。

            本版修复了 macOS 后台 MCP 服务的状态识别：MCP 连接页与连接弹窗会自动刷新，已由系统后台服务运行时显示真实状态，避免重复启动时误报端口占用。

            macOS 在 GitHub Runner 上执行完整 Rust 测试。Windows 执行前端检查、Worker 构建和 Rust 测试编译；此发布流程不执行 Windows Rust 运行测试。

            macOS DMG 和 Windows EXE 均未做发布者证书签名；安装时系统可能要求手动确认来源。
          fail_on_unmatched_files: true
          files: |
            dist/windows/*.exe
            dist/macos/*.dmg
